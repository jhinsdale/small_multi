[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "small-multi"
version = "0.9"
description = "Small Multiples Charts by John Hinsdale"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-only"
authors = [
    { name = "John Hinsdale" },
]
keywords = ["svg", "charts", "small-multiples", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.scripts]
sm-chart = "sm_chart:main"

[tool.setuptools]
py-modules = [
    "chart",
    "htmltag",
    "small_multi",
    "sm_chart",
    "svgtag",
]
include-package-data = true

[tool.setuptools.data-files]
"data" = [
    "data/mlb_3000_hit_club_hits_by_year.tsv",
    "data/mlb_3000_strikeout_club_strikeouts_by_year.tsv",
    "data/mlb_500_home_run_club_home_runs_by_year.tsv",
]
